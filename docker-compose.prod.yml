# LAIVY em produção (servidor). Guia completo em DEPLOY.md.
#
#   python3 scripts/gerar-env-prod.py        # cria .env.prod com segredos novos
#   (edite .env.prod: DOMINIO, EMAIL_CERTIFICADO, SMTP_*)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Diferenças para o docker-compose.yml de desenvolvimento:
#   - só o Caddy fica exposto (80/443, HTTPS automático); backend, MySQL,
#     n8n e Qdrant ficam apenas na rede interna do Docker;
#   - a aplicação usa um usuário próprio do MySQL, nunca o root;
#   - sem Mailpit: e-mail sai pelo SMTP real (obrigatório);
#   - variáveis sem valor fazem a subida falhar com a mensagem do ":?".

x-logs: &logs
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }   # não deixa log encher o disco

services:

  caddy:
    image: caddy:2.8.4-alpine
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - DOMINIO=${DOMINIO:?defina DOMINIO no .env.prod}
      - EMAIL_CERTIFICADO=${EMAIL_CERTIFICADO:?defina EMAIL_CERTIFICADO no .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    <<: *logs

  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-sistema_esportivo}
      # usuário da aplicação, criado na primeira subida com acesso só ao banco do sistema
      - MYSQL_USER=${DB_APP_USER:-laivy}
      - MYSQL_PASSWORD=${DB_APP_PASSWORD:?defina DB_APP_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # senha via variável de ambiente, não na linha de comando (não aparece no ps)
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    <<: *logs

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/${DB_NAME:-sistema_esportivo}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_APP_USER:-laivy}
      - DB_PASSWORD=${DB_APP_PASSWORD:?defina DB_APP_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-28800000}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/laivy-assistente
      - N8N_TOKEN=${N8N_TOKEN:?defina N8N_TOKEN}
      - SMTP_HOST=${SMTP_HOST:?defina SMTP_HOST (e-mail das credenciais dos atletas)}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:?defina SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?defina SMTP_PASSWORD}
      - SMTP_AUTH=${SMTP_AUTH:-true}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - MAIL_FROM=${MAIL_FROM:?defina MAIL_FROM}
      - APP_URL=https://${DOMINIO:?defina DOMINIO}
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/login.html"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    <<: *logs

  n8n:
    image: n8nio/n8n:2.23.2
    depends_on:
      - qdrant
    environment:
      # chave que cifra as credenciais (OpenAI, Qdrant) guardadas no n8n:
      # sem ela o backup do volume não serve para restaurar em outro lugar
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY}
      # o workflow confere o X-Token do backend e envia o mesmo token às
      # ferramentas com {{ $env.N8N_TOKEN }} — por isso o $env precisa estar liberado
      - N8N_TOKEN=${N8N_TOKEN:?defina N8N_TOKEN}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    ports:
      # editor do n8n só no próprio servidor; acesse por túnel SSH (ver DEPLOY.md)
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    <<: *logs

  qdrant:
    image: qdrant/qdrant:v1.18.1
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    <<: *logs

volumes:
  mysql_data:
  n8n_data:
  qdrant_data:
  caddy_data:
  caddy_config:
