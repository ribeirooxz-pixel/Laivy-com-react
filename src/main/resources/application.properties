spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_esportivo?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Flyway é dono do schema (veja src/main/resources/db/migration). Hibernate
# só confere se o mapeamento bate — não altera mais nada sozinho.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=baseline
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080
# Em produção o backend fica atrás do proxy HTTPS (Caddy, ver deploy/): confia
# no X-Forwarded-For/Proto dele para saber o IP real (limite de login por IP)
# e o esquema https. O Tomcat só aceita esses cabeçalhos de IPs internos.
server.forward-headers-strategy=native

# Desativa o handler de favicon padrão do Spring MVC
# (o nosso está em /static/favicon.ico e é servido pelo WebConfig)
spring.mvc.favicon.enabled=false

# Desativa a mensagem de open-in-view
spring.jpa.open-in-view=false

assistente.n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/laivy-assistente}
assistente.n8n.token=${N8N_TOKEN}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}

# O cookie do JWT sai sempre HttpOnly + Secure + SameSite=Strict
# (UsuarioController). Navegadores aceitam Secure em http://localhost, então
# funciona em dev; em qualquer outro endereço o acesso precisa ser HTTPS.

# E-mail (credenciais dos atletas cadastrados pela IA) — valores vêm do docker-compose/.env
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${MAIL_FROM:laivy@localhost}
app.url=${APP_URL:http://localhost:8080}

# Log de atividades (Painel Admin): registros mais antigos que isso são apagados todo dia às 3h30
auditoria.retencao-dias=${AUDITORIA_RETENCAO_DIAS:180}
